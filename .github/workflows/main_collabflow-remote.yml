# Deploy to Azure Web App - collabflow-remote
# Let Azure Oryx handle the build

name: Build and deploy Node.js app to Azure Web App - collabflow-remote

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Create zip for deployment
        run: |
          # Create a zip of the source code (Azure will build it)
          zip -r deploy.zip . -x "node_modules/*" -x ".git/*" -x ".next/*"
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_93AEEE37844C4765B792AD79DD5DBE9B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_654EC8EE63CB4B679EC639816B82D9BE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_55428A8007304CF59D0611C72057F07E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'collabflow-remote'
          slot-name: 'Production'
          package: deploy.zip