# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - collabflow-remote

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        run: |
          npm install
          npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "build-time-secret-not-used-in-production"
          AUTH_SECRET: "build-time-secret-not-used-in-production"
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare deployment package
        run: |
          # The standalone folder already contains server.js and node_modules
          # We need to copy .next/standalone as the base
          mkdir -p deploy
          
          # Copy the entire standalone directory contents
          cp -r .next/standalone/* deploy/
          
          # The static files need to be at deploy/.next/static
          mkdir -p deploy/.next/static
          cp -r .next/static/* deploy/.next/static/
          
          # Copy public folder
          mkdir -p deploy/public
          cp -r public/* deploy/public/
          
          # Copy prisma
          cp -r prisma deploy/
          
          # List what we're deploying for debugging
          echo "=== Deploy folder structure ==="
          ls -la deploy/
          echo "=== .next folder ==="
          ls -la deploy/.next/ || echo "No .next folder"
          echo "=== Package.json scripts ==="
          cat deploy/package.json || echo "No package.json"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_93AEEE37844C4765B792AD79DD5DBE9B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_654EC8EE63CB4B679EC639816B82D9BE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_55428A8007304CF59D0611C72057F07E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'collabflow-remote'
          slot-name: 'Production'
          package: .