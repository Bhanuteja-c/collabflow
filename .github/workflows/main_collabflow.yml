# Deploy Next.js standalone build to Azure Web App

name: Build and deploy Node.js app to Azure Web App - collabflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        run: |
          npm install
          npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "build-time-secret-not-used-in-production"
          AUTH_SECRET: "build-time-secret-not-used-in-production"
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare standalone deployment
        run: |
          # Create deployment folder
          mkdir -p deploy
          
          # Copy standalone output (use -a to preserve hidden folders like .next)
          cp -a .next/standalone/. deploy/
          
          # Copy static files to the correct locations
          mkdir -p deploy/public
          cp -r public/. deploy/public/ || true
          
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          
          # Copy prisma schema
          mkdir -p deploy/prisma
          cp prisma/schema.prisma deploy/prisma/
          
          # Debug: List contents
          echo "=== Deploy folder contents ==="
          ls -la deploy/
          echo "=== .next folder contents ==="
          ls -la deploy/.next/ || echo "No .next folder"
          echo "=== All hidden files ==="
          find deploy -name ".*" -type f | head -20

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D9C4815F7DAF4D189ECEA8084C5371B1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0BEDCEF7B6B8470A9FB69693D6CC92F4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2A6E56C753654CF5932FE8F79BD83242 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'collabflow'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.js'